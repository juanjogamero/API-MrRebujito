services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mrrebujito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rebujito_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d mrrebujito"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rebujito_postgres:
