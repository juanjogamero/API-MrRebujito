name: Java · MrRebujito API
on:
  push:
    branches: [main, feature/profesionalizar-mrrebujito]
    paths: ["src/**","pom.xml",".github/workflows/java.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash ./mvnw --batch-mode verify
